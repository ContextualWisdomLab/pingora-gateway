# Release dependency policy for the shared edge runtime.
# Vulnerability and unsoundness advisories remain fail-closed. Unmaintained
# transitive crates inherited from the pinned upstream framework are reported
# without blocking; an unmaintained direct workspace dependency still fails.

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/cloudflare/pingora.git"]
