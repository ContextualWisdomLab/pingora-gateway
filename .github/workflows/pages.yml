name: Publish Documentation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require protected default branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact protected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build docs with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
          build_revision: ${{ github.sha }}

      - name: Bind site artifact to source revision
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          printf '%s\n' "$GITHUB_SHA" > _site/source-sha.txt

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    name: deploy-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Verify public site source identity
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          case "$PAGE_URL" in
            https://*) ;;
            *) echo "Pages URL must use HTTPS" >&2; exit 1 ;;
          esac
          for attempt in $(seq 1 12); do
            observed_sha="$(curl --fail --silent --show-error --location --max-time 10 "${PAGE_URL%/}/source-sha.txt" 2>/dev/null || true)"
            if [ "$observed_sha" = "$EXPECTED_SHA" ]; then
              curl --fail --silent --show-error --location --max-time 10 "${PAGE_URL%/}/" >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "Published Pages source identity did not converge to $EXPECTED_SHA" >&2
          exit 1
