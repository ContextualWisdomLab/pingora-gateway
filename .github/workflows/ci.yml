name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libclang-dev libssl-dev pkg-config curl python3
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Generate dependency lock for verification
        run: cargo generate-lockfile
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: DDD architecture fitness
        run: bash tests/architecture.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets --all-features
      - name: Production-path integration
        run: bash tests/integration.sh
      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      - name: Generate CycloneDX SBOM evidence
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename sbom.cdx.json
          test -s sbom.cdx.json
      - name: OCI build
        run: docker build --tag pingora-gateway:${{ github.sha }} .
