name: Supply Chain

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  candidate-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Install pinned dependency-policy tool
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit committed dependency graph
        run: |
          test -s Cargo.lock
          cargo deny check advisories licenses sources bans
          git diff --exit-code -- Cargo.lock

      - name: Build exact generic and migration candidate images
        run: |
          docker build --tag "cwl-pingora-gateway:${EXPECTED_SHA}" .
          docker build --target pg-erd-migration --tag "cwl-pingora-pg-erd-migration:${EXPECTED_SHA}" .

      - name: Generate SPDX dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: candidate.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Scan exact generic candidate image
        id: scan_gateway_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: cwl-pingora-gateway:${{ env.EXPECTED_SHA }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: json
          output: trivy-gateway-image.json
          exit-code: '1'

      - name: Scan exact pg-erd migration candidate image
        id: scan_pg_erd_migration_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: cwl-pingora-pg-erd-migration:${{ env.EXPECTED_SHA }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          format: json
          output: trivy-pg-erd-migration-image.json
          exit-code: '1'

      - name: Bind candidate evidence to exact source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for evidence in Cargo.lock deny.toml candidate.spdx.json trivy-gateway-image.json trivy-pg-erd-migration-image.json; do
            test -s "$evidence"
          done
          gateway_image_id="$(docker image inspect "cwl-pingora-gateway:${EXPECTED_SHA}" --format '{{.Id}}')"
          migration_image_id="$(docker image inspect "cwl-pingora-pg-erd-migration:${EXPECTED_SHA}" --format '{{.Id}}')"
          {
            printf 'evidence_kind=unreleased-candidate\n'
            printf 'source_sha=%s\n' "$EXPECTED_SHA"
            printf 'gateway_local_image_id=%s\n' "$gateway_image_id"
            printf 'pg_erd_migration_local_image_id=%s\n' "$migration_image_id"
            printf 'gateway_scan_outcome=%s\n' '${{ steps.scan_gateway_image.outcome }}'
            printf 'pg_erd_migration_scan_outcome=%s\n' '${{ steps.scan_pg_erd_migration_image.outcome }}'
            sha256sum Cargo.lock deny.toml candidate.spdx.json trivy-gateway-image.json trivy-pg-erd-migration-image.json
          } > candidate-evidence.txt

      - name: Upload exact candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-evidence-${{ env.EXPECTED_SHA }}
          path: |
            Cargo.lock
            deny.toml
            candidate.spdx.json
            trivy-gateway-image.json
            trivy-pg-erd-migration-image.json
            candidate-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce both image vulnerability gates
        if: ${{ always() }}
        run: |
          test '${{ steps.scan_gateway_image.outcome }}' = success
          test '${{ steps.scan_pg_erd_migration_image.outcome }}' = success
