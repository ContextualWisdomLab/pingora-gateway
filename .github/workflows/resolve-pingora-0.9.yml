name: Resolve Pingora 0.9 lock

on:
  push:
    branches:
      - test/parked-read-shutdown-red-v1

permissions:
  contents: read

concurrency:
  group: resolve-pingora-0.9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Resolve exact crates.io Pingora 0.9.0 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text()
          old_pingora = 'pingora = { version = "=0.8.0", git = "https://github.com/cloudflare/pingora.git", rev = "09696b51bc59315353d96686355861604d0bb48c", features = ["proxy", "openssl"] }'
          old_prom = 'pingora-prometheus = { version = "=0.8.0", git = "https://github.com/cloudflare/pingora.git", rev = "09696b51bc59315353d96686355861604d0bb48c" }'
          new_pingora = 'pingora = { version = "=0.9.0", features = ["proxy", "openssl"] }'
          new_prom = 'pingora-prometheus = "=0.9.0"'
          if text.count(old_pingora) != 1 or text.count(old_prom) != 1:
              raise SystemExit("expected exact old Pingora dependency pins not found exactly once")
          path.write_text(text.replace(old_pingora, new_pingora).replace(old_prom, new_prom))
          PY
          cargo metadata --format-version 1 >/tmp/cargo-metadata.json
          cargo metadata --locked --format-version 1 >/tmp/cargo-metadata-locked.json
          grep -F 'name = "pingora"' Cargo.lock >/dev/null
          grep -F 'version = "0.9.0"' Cargo.lock >/dev/null
          git diff -- Cargo.toml Cargo.lock
          sha256sum Cargo.toml Cargo.lock
      - name: Upload Cargo-generated resolver output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pingora-0.9-resolver-${{ github.sha }}
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1
