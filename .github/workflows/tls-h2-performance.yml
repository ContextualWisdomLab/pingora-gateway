name: TLS H2 Performance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tls-h2-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  tls-h2-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates curl libssl-dev openssl pkg-config
      - name: Install and verify release Rust 1.98.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
          rustc --version --verbose | grep -Fx 'release: 1.98.1'
      - name: Build exact release gateway and bounded Rust origin
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --bin cwl-pingora-gateway
          rustfmt --edition 2021 --check tests/load/load_origin.rs
          rustc --edition 2021 -D warnings --test tests/load/load_origin.rs -o /tmp/load_origin_tests
          /tmp/load_origin_tests
          rustc --edition 2021 -D warnings -C opt-level=3 -C debuginfo=0 \
            --out-dir /tmp tests/load/load_origin.rs
      - name: Install checksum-pinned k6 2.2.0
        shell: bash
        run: |
          set -euo pipefail
          archive="k6-v2.2.0-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/grafana/k6/releases/download/v2.2.0/${archive}" \
            --output "/tmp/${archive}"
          echo "b5a8003c86f35f5cd5ceef1490312c48e587696c94d998cefc6d7b3b4cb1597d  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Validate TLS H2 performance harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/load/run_tls_h2_performance.sh
          k6 inspect tests/load/gateway_tls_h2_performance.js >/dev/null
      - name: Exercise fresh-handshake and reused-connection buyer paths
        shell: bash
        run: bash tests/load/run_tls_h2_performance.sh
      - name: Require both latency evidence receipts
        run: |
          test -s k6-tls-h2-fresh-summary.json
          test -s k6-tls-h2-reuse-summary.json
      - name: Upload exact-SHA TLS H2 performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: k6-tls-h2-performance-${{ env.EXPECTED_SHA }}
          path: |
            k6-tls-h2-fresh-summary.json
            k6-tls-h2-reuse-summary.json
          if-no-files-found: ignore
          retention-days: 7
