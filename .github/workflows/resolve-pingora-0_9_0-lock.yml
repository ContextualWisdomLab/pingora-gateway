name: Resolve Pingora 0.9.0 lock

on:
  push:
    branches:
      - test/parked-read-shutdown-red-v1
    paths:
      - Cargo.toml
      - .github/workflows/resolve-pingora-0_9_0-lock.yml

permissions:
  contents: write

concurrency:
  group: resolve-pingora-0-9-0-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Resolve published Pingora 0.9.0 packages
        run: |
          set -euo pipefail
          cargo update -p pingora --precise 0.9.0
          cargo update -p pingora-prometheus --precise 0.9.0
          cargo metadata --locked --format-version 1 >/tmp/metadata.json
          git diff --check -- Cargo.lock
      - name: Commit generated lock to this exact branch
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- Cargo.lock)"
          git diff --exit-code -- Cargo.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: resolve Pingora 0.9.0 lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload Cargo-generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pingora-0.9.0-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
