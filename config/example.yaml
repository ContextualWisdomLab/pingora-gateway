version: 1
listener: 0.0.0.0:8080
limits:
  max_header_count: 96
  max_header_bytes: 65536
  max_body_bytes: 10485760
  connect_timeout_ms: 3000
  read_timeout_ms: 30000
  write_timeout_ms: 30000
routes:
  - id: example-origin
    host: gateway.example.test
    path_prefix: /
    upstream: https://example.com
