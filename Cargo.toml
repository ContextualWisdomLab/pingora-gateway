[package]
name = "cwl-pingora-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
description = "ContextualWisdomLab shared edge runtime built on Cloudflare Pingora"
repository = "https://github.com/ContextualWisdomLab/pingora-gateway"

[lib]
name = "cwl_pingora_gateway"
path = "src/lib.rs"

[[bin]]
name = "cwl-pingora-gateway"
path = "src/bin/cwl-pingora-gateway.rs"

[[bin]]
name = "cwl-pingora-pg-erd-migration"
path = "src/bin/cwl-pingora-pg-erd-migration.rs"

[dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
env_logger = "0.11.8"
log = { version = "0.4.28", features = ["std"] }
pingora = { version = "=0.9.0", features = ["proxy", "openssl"] }
pingora-prometheus = "=0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
thiserror = "2.0.16"

[dev-dependencies]
tempfile = "3.21.0"
